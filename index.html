<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Trace: Hardcore Arcade</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #f542ec; --danger: #ef4444; --success: #22c55e; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        /* Stats Header */
        .stats-bar { background: var(--panel); padding: 15px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; gap: 30px; align-items: center; margin-bottom: 20px; border: 1px solid #334155; }
        .stat-item { text-align: center; min-width: 100px; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
        .stat-value { font-size: 1.4rem; font-weight: bold; margin: 0; color: var(--accent); }
        
        /* Game Area */
        .game-wrapper {
            position: relative; width: 400px; height: 400px; background: white;
            border: 4px solid var(--accent); border-radius: 12px; overflow: hidden;
        }
        #target-photo {
            position: absolute; top: 0; left: 0; width: 400px; height: 400px;
            object-fit: contain; z-index: 1; opacity: 0; pointer-events: none;
        }
        canvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; cursor: crosshair; touch-action: none; display: block; }

        /* Controls */
        .controls { margin: 25px 0; display: flex; gap: 15px; }
        button { padding: 14px 40px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; background: var(--success); transition: all 0.2s; }
        button:hover { filter: brightness(1.1); }
        button:active { transform: scale(0.95); }
        button:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
        .clear-btn { background: #64748b; padding: 14px 20px; }

        /* Overlays */
        #grade-overlay, #game-over-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.96); z-index: 500;
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .preview-stack { position: relative; width: 400px; height: 400px; background: white; border: 4px solid white; border-radius: 8px; margin-bottom: 20px; }
        .preview-stack canvas { position: absolute; top: 0; left: 0; }

        /* Gallery */
        #gallery-section { width: 100%; max-width: 900px; margin-top: 40px; border-top: 1px solid #334155; padding-top: 20px; text-align: center; }
        #gallery-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .gallery-item { background: var(--panel); padding: 10px; border-radius: 8px; border: 1px solid #334155; font-size: 0.8rem; }
        .gallery-item img { width: 100%; border-radius: 4px; background: white; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item"><div class="stat-label">Time</div><p id="timer" class="stat-value">--</p></div>
        <div class="stat-item"><div class="stat-label">Min Accuracy</div><p id="target-acc-display" class="stat-value">15%</p></div>
        <div class="stat-item"><div class="stat-label">Photos Done</div><p id="count-display" class="stat-value">0</p></div>
    </div>

    <div class="game-wrapper">
        <img id="target-photo" src="" alt="Target">
        <canvas id="drawing-canvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <button id="action-btn" onclick="handleMainAction()">START GAME</button>
        <button class="clear-btn" onclick="clearCanvas()">CLEAR</button>
    </div>

    <div id="grade-overlay">
        <h2 id="grade-title">RESULTS</h2>
        <div class="preview-stack">
            <canvas id="res-target-canvas" width="400" height="400"></canvas>
            <canvas id="res-heat-canvas" width="400" height="400"></canvas>
        </div>
        <p style="margin:0; color:#94a3b8;">Accuracy - Penalty</p>
        <h2 id="grade-percent" style="color: var(--accent); font-size: 3rem; margin: 5px 0;">0%</h2>
        <button id="continue-btn">CONTINUE</button>
    </div>

    <div id="game-over-screen">
        <h1 style="font-size: 4rem; color: var(--danger); margin: 0;">GAME OVER</h1>
        <p id="fail-message" style="color: #94a3b8; font-size: 1.2rem;"></p>
        <div id="final-stats-text" style="font-size: 1.5rem; margin: 20px 0; background: var(--panel); padding: 20px; border-radius: 12px;"></div>
        <button onclick="location.reload()">RESTART SESSION</button>
    </div>

    <div id="gallery-section">
        <h3>Success History</h3>
        <div id="gallery-container"></div>
    </div>

    <script>
        // --- DATABASE ---
        const PHOTO_DB = [
            "Assets/spoon.jpg",
            "Assets/money.png",
            "Assets/sploosh.png",
            "Assets/car.png"
        ];

        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const targetImg = document.getElementById('target-photo');
        const actionBtn = document.getElementById('action-btn');
        const galleryContainer = document.getElementById('gallery-container');
        
        let isDrawing = false, canDraw = false, timerId = null;
        let photosCopied = 0, totalAccuracyEarned = 0;
        let targetAccuracy = 15; // Lowered starting target due to penalties
        let timeAllowed = 30;
        let lastX = 0, lastY = 0;
        const FADE_SPEED = 10;

        function init() {
            ctx.strokeStyle = "black";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        function getContainOffsets(img, cw, ch) {
            const imgRatio = img.naturalWidth / img.naturalHeight;
            const conRatio = cw / ch;
            let dw, dh, ox, oy;
            if (imgRatio > conRatio) {
                dw = cw; dh = cw / imgRatio;
            } else {
                dh = ch; dw = ch * imgRatio;
            }
            ox = (cw - dw) / 2; oy = (ch - dh) / 2;
            return { x: ox, y: oy, w: dw, h: dh };
        }

        function handleMainAction() {
            if (actionBtn.innerText === "START GAME" || actionBtn.innerText === "NEXT LEVEL") {
                startLevel();
            }
        }

        function startLevel() {
            canDraw = true;
            actionBtn.disabled = true;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            targetImg.src = PHOTO_DB[Math.floor(Math.random() * PHOTO_DB.length)];

            if (photosCopied > 0 && photosCopied % 4 === 0) {
                timeAllowed = Math.max(10, timeAllowed - 5);
            }

            let timeLeft = timeAllowed;
            document.getElementById('timer').innerText = timeLeft + "s";
            document.getElementById('target-acc-display').innerText = targetAccuracy + "%";

            targetImg.onload = () => {
                targetImg.style.transition = "none";
                targetImg.style.opacity = "1";
                setTimeout(() => {
                    targetImg.style.transition = `opacity ${FADE_SPEED}s linear`;
                    targetImg.style.opacity = "0";
                }, 100);
            };

            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if (timeLeft <= 0) endLevel();
            }, 1000);
        }

        function endLevel() {
            clearInterval(timerId);
            canDraw = false;
            processResults();
        }

        function processResults() {
            const gCanvas = document.createElement('canvas');
            gCanvas.width = 400; gCanvas.height = 400;
            const gCtx = gCanvas.getContext('2d');
            gCtx.fillStyle = "white"; gCtx.fillRect(0,0,400,400);
            gCtx.drawImage(canvas, 0, 0);

            const tCanvas = document.getElementById('res-target-canvas');
            const hCanvas = document.getElementById('res-heat-canvas');
            const tCtx = tCanvas.getContext('2d');
            const hCtx = hCanvas.getContext('2d');
            
            tCtx.fillStyle = "white"; tCtx.fillRect(0,0,400,400);
            hCtx.clearRect(0,0,400,400);

            const dims = getContainOffsets(targetImg, 400, 400);
            tCtx.drawImage(targetImg, dims.x, dims.y, dims.w, dims.h);

            const tData = tCtx.getImageData(0,0,400,400);
            const pData = gCtx.getImageData(0,0,400,400).data;
            const hData = hCtx.createImageData(400,400);

            let targetInkPixels = 0;
            let correctHits = 0;
            let strayPixels = 0;

            for (let i = 0; i < tData.data.length; i += 4) {
                const isTDark = ((tData.data[i] + tData.data[i+1] + tData.data[i+2])/3) < 160;
                const isPDark = ((pData[i] + pData[i+1] + pData[i+2])/3) < 160;
                
                if (isTDark) {
                    targetInkPixels++;
                    if (isPDark) {
                        correctHits++;
                        hData.data[i] = 34; hData.data[i+1] = 197; hData.data[i+2] = 94; hData.data[i+3] = 200;
                    }
                } else if (isPDark) {
                    strayPixels++;
                    hData.data[i] = 239; hData.data[i+1] = 68; hData.data[i+2] = 68; hData.data[i+3] = 200;
                }
            }
            hCtx.putImageData(hData, 0, 0);

            // --- Penalized Scoring Math ---
            let baseAccuracy = (correctHits / Math.max(1, targetInkPixels)) * 100;
            let penalty = (strayPixels / Math.max(1, targetInkPixels)) * 35; 
            const finalScore = Math.floor(Math.max(0, baseAccuracy - penalty));
            
            showGrade(finalScore);
        }

        function showGrade(score) {
            const overlay = document.getElementById('grade-overlay');
            document.getElementById('grade-percent').innerText = score + "%";
            overlay.style.display = "flex";

            if (score < targetAccuracy) {
                document.getElementById('grade-title').innerText = "LOW PRECISION!";
                document.getElementById('grade-title').style.color = "var(--danger)";
                document.getElementById('continue-btn').onclick = () => {
                    overlay.style.display = "none";
                    gameOver(`you FAIL!!!!!!! Minimum ${targetAccuracy}% required. You scored ${score}%`);
                };
            } else {
                document.getElementById('grade-title').innerText = "CLEARED!!!";
                document.getElementById('grade-title').style.color = "var(--success)";
                saveToGallery(score);
                photosCopied++;
                totalAccuracyEarned += score;
                targetAccuracy += 2; // Slower climb
                
                document.getElementById('continue-btn').onclick = () => {
                    overlay.style.display = "none";
                    document.getElementById('count-display').innerText = photosCopied;
                    actionBtn.innerText = "NEXT LEVEL";
                    actionBtn.disabled = false;
                };
            }
        }

        function saveToGallery(score) {
            const combined = document.createElement('canvas');
            combined.width = 400; combined.height = 400;
            const cCtx = combined.getContext('2d');
            cCtx.fillStyle = "white"; cCtx.fillRect(0,0,400,400);
            cCtx.drawImage(document.getElementById('res-target-canvas'), 0, 0);
            cCtx.drawImage(document.getElementById('res-heat-canvas'), 0, 0);
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `<img src="${combined.toDataURL()}"><span>Match: ${score}%</span>`;
            galleryContainer.prepend(item);
        }

        function gameOver(reason) {
            const avgAcc = photosCopied === 0 ? 0 : Math.floor(totalAccuracyEarned / photosCopied);
            document.getElementById('fail-message').innerText = reason;
            document.getElementById('final-stats-text').innerHTML = `Cleared: ${photosCopied}<br>Avg Precision: ${avgAcc}%`;
            document.getElementById('game-over-screen').style.display = "flex";
        }

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return { x: x * (canvas.width / rect.width), y: y * (canvas.height / rect.height) };
        }
        function start(e) { if (!canDraw) return; isDrawing = true; const pos = getPos(e); [lastX, lastY] = [pos.x, pos.y]; }
        function draw(e) {
            if (!isDrawing || !canDraw) return;
            const pos = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
            if(e.touches) e.preventDefault();
        }
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);
        init();
    </script>
</body>
</html>
