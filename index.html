<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sketch Matcher Game</title>
    <style>
        :root { --bg: #f4f4f9; --panel: #ffffff; --accent: #2563eb; }
        body { font-family: sans-serif; background-color: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .stats-bar { background: var(--panel); padding: 15px 30px; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; gap: 40px; align-items: center; margin-bottom: 20px; }
        .play-area { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .panel { background: var(--panel); padding: 10px; border-radius: 12px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); text-align: center; }
        canvas, #target-photo { width: 400px; height: 400px; border: 2px solid #e5e7eb; border-radius: 8px; background-color: white; display: block; }
        canvas { cursor: crosshair; touch-action: none; }
        .controls { margin-top: 25px; display: flex; gap: 15px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; color: white; }
        #start-btn { background: #059669; }
        .clear-btn { background: #ef4444; }
        button:disabled { background: #9ca3af; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <h2 id="timer">Time: 30s</h2>
        <h2 id="score-display">Score: --</h2>
    </div>

    <div class="play-area">
        <div class="panel">
            <h3>Reference</h3>
            <img id="target-photo" src="assets/rad.jpg" alt="Target Image">
        </div>
        <div class="panel">
            <h3>Your Sketch</h3>
            <canvas id="drawing-canvas" width="400" height="400"></canvas>
        </div>
    </div>

    <div class="controls">
        <button id="start-btn" onclick="startGame()">START CHALLENGE</button>
        <button class="clear-btn" onclick="clearCanvas()">CLEAR</button>
    </div>

    <script>
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const targetImg = document.getElementById('target-photo');
        const timerTxt = document.getElementById('timer');
        const scoreTxt = document.getElementById('score-display');
        const startBtn = document.getElementById('start-btn');

        // State variables
        let isDrawing = false;
        let canDraw = false;
        let lastX = 0;
        let lastY = 0;
        let timeLeft = 30;
        let timerId = null;

        // --- Initialization ---
        function initSettings() {
            ctx.strokeStyle = "black";
            ctx.lineWidth = 8;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            clearCanvas(); 
        }

        // --- Game Logic ---
        function startGame() {
            console.log("Game Starting...");
            canDraw = true;
            timeLeft = 30;
            scoreTxt.innerText = "Score: --";
            startBtn.disabled = true;
            clearCanvas();

            if (timerId) clearInterval(timerId);

            timerId = setInterval(() => {
                timeLeft--;
                timerTxt.innerText = `Time: ${timeLeft}s`;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            clearInterval(timerId);
            canDraw = false;
            startBtn.disabled = false;
            timerTxt.innerText = "FINISHED!";
            calculateScore();
        }

        function calculateScore() {
            const tCanvas = document.createElement('canvas');
            tCanvas.width = 400;
            tCanvas.height = 400;
            const tCtx = tCanvas.getContext('2d');
            
            try {
                tCtx.drawImage(targetImg, 0, 0, 400, 400);
                const targetData = tCtx.getImageData(0, 0, 400, 400).data;
                const playerData = ctx.getImageData(0, 0, 400, 400).data;

                let diff = 0;
                for (let i = 0; i < targetData.length; i += 4) {
                    // Check brightness difference
                    diff += Math.abs(targetData[i] - playerData[i]);
                }

                const maxError = 255 * (targetData.length / 4);
                let accuracy = 100 - (diff / maxError * 100);
                scoreTxt.innerText = `Score: ${Math.max(0, Math.floor(accuracy))}%`;
            } catch (e) {
                console.error("Scoring error (likely Cross-Origin):", e);
                scoreTxt.innerText = "Score: Error";
            }
        }

        // --- Drawing Engine ---
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function start(e) {
            if (!canDraw) return;
            isDrawing = true;
            const pos = getPos(e);
            [lastX, lastY] = [pos.x, pos.y];
        }

        function draw(e) {
            if (!isDrawing || !canDraw) return;
            const pos = getPos(e);
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
        }

        function stop() { isDrawing = false; }

        function clearCanvas() {
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // --- Event Listeners ---
        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stop);

        canvas.addEventListener('touchstart', (e) => { start(e); e.preventDefault(); }, {passive: false});
        canvas.addEventListener('touchmove', (e) => { draw(e); e.preventDefault(); }, {passive: false});
        canvas.addEventListener('touchend', stop);

        // Run setup
        initSettings();
    </script>
</body>
</html>
