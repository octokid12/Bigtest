<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Trace: Arcade Edition</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --accent: #38bdf8; --danger: #ef4444; --success: #22c55e; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: var(--bg); color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        
        .stats-bar { background: var(--panel); padding: 15px 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); display: flex; gap: 30px; align-items: center; margin-bottom: 20px; border: 1px solid #334155; }
        .stat-item { text-align: center; min-width: 100px; }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
        .stat-value { font-size: 1.4rem; font-weight: bold; margin: 0; color: var(--accent); }
        
        .game-wrapper {
            position: relative; width: 400px; height: 400px; background: white;
            border: 4px solid var(--accent); border-radius: 12px; overflow: hidden;
        }

        #target-photo {
            position: absolute; top: 0; left: 0; width: 400px; height: 400px;
            object-fit: contain; z-index: 1; opacity: 0; pointer-events: none;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 2; background: transparent; cursor: crosshair; touch-action: none; }

        .controls { margin: 25px 0; }
        button { padding: 14px 40px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; background: var(--success); transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        button:disabled { background: #475569; cursor: not-allowed; }

        /* Game Over Overlay */
        #game-over-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 1000;
            display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        .final-stats { font-size: 1.5rem; margin: 20px 0; line-height: 1.6; }
        .fail-reason { color: var(--danger); font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-label">Time</div>
            <p id="timer" class="stat-value">30s</p>
        </div>
        <div class="stat-item">
            <div class="stat-label">Target</div>
            <p id="target-acc-display" class="stat-value">20%</p>
        </div>
        <div class="stat-item">
            <div class="stat-label">Completed</div>
            <p id="count-display" class="stat-value">0</p>
        </div>
    </div>

    <div class="game-wrapper">
        <img id="target-photo" src="" alt="Target">
        <canvas id="drawing-canvas" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <button id="action-btn" onclick="handleMainAction()">START GAME</button>
    </div>

    <div id="game-over-screen">
        <h1 style="font-size: 3rem; color: var(--danger);">GAME OVER</h1>
        <p id="fail-message" class="fail-reason"></p>
        <div class="final-stats" id="final-stats-text"></div>
        <button onclick="location.reload()">TRY AGAIN</button>
    </div>

    <script>
        // Photo Database - Add your URLs here!
        const PHOTO_DB = [
            "Assets/spoon.jpg",
            "Assets/money.png",
            "Assets/sploosh.png",
            "Assets/car.png"
        ];

        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const targetImg = document.getElementById('target-photo');
        const actionBtn = document.getElementById('action-btn');
        
        // Game State
        let isDrawing = false, canDraw = false;
        let lastX = 0, lastY = 0;
        let timerId = null;
        
        // Survival Metrics
        let currentLevel = 0;
        let targetAccuracy = 20;
        let photosCopied = 0;
        let totalAccuracyEarned = 0;
        let timeAllowed = 30;
        const FADE_SPEED = 8; // Disappear in 8s

        function init() {
            ctx.strokeStyle = "black";
            ctx.lineWidth = 5;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
        }

        function handleMainAction() {
            if (actionBtn.innerText === "START GAME" || actionBtn.innerText === "NEXT LEVEL") {
                startLevel();
            }
        }

        function startLevel() {
            canDraw = true;
            actionBtn.disabled = true;
            
            // Pick Random Photo
            const randomPhoto = PHOTO_DB[Math.floor(Math.random() * PHOTO_DB.length)];
            targetImg.src = randomPhoto;

            // Difficulty Scaling every 4 copies
            if (photosCopied > 0 && photosCopied % 4 === 0) {
                timeAllowed = Math.max(10, timeAllowed - 5);
            }

            let timeLeft = timeAllowed;
            document.getElementById('timer').innerText = timeLeft + "s";
            document.getElementById('target-acc-display').innerText = targetAccuracy + "%";
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Trigger Fade
            targetImg.onload = () => {
                targetImg.style.transition = "none";
                targetImg.style.opacity = "1";
                setTimeout(() => {
                    targetImg.style.transition = `opacity ${FADE_SPEED}s linear`;
                    targetImg.style.opacity = "0";
                }, 100);
            };

            if (timerId) clearInterval(timerId);
            timerId = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if (timeLeft <= 0) endLevel();
            }, 1000);
        }

        function endLevel() {
            clearInterval(timerId);
            canDraw = false;
            processResults();
        }

        function processResults() {
            const gradingCanvas = document.createElement('canvas');
            gradingCanvas.width = 400; gradingCanvas.height = 400;
            const gCtx = gradingCanvas.getContext('2d');
            gCtx.fillStyle = "white";
            gCtx.fillRect(0, 0, 400, 400);
            gCtx.drawImage(canvas, 0, 0);

            // Compare Logic (Simplified for brevity, keeping your accuracy logic)
            const tCanvas = document.createElement('canvas');
            tCanvas.width = 400; tCanvas.height = 400;
            const tCtx = tCanvas.getContext('2d');
            tCtx.drawImage(targetImg, 0, 0, 400, 400);
            
            const tPixels = tCtx.getImageData(0, 0, 400, 400).data;
            const pPixels = gCtx.getImageData(0, 0, 400, 400).data;

            let targetInk = 0, hits = 0;
            for (let i = 0; i < tPixels.length; i += 4) {
                const isTDark = ((tPixels[i] + tPixels[i+1] + tPixels[i+2])/3) < 160;
                const isPDark = ((pPixels[i] + pPixels[i+1] + pPixels[i+2])/3) < 160;
                if (isTDark) targetInk++;
                if (isTDark && isPDark) hits++;
            }

            const currentAccuracy = Math.floor((hits / targetInk) * 100);
            
            if (currentAccuracy < targetAccuracy) {
                gameOver(`You needed ${targetAccuracy}%, but only got ${currentAccuracy}%`);
            } else {
                // Success - Scale Up
                photosCopied++;
                totalAccuracyEarned += currentAccuracy;
                targetAccuracy += 3; // Increase target by 3% each time
                
                document.getElementById('count-display').innerText = photosCopied;
                actionBtn.disabled = false;
                actionBtn.innerText = "NEXT LEVEL";
            }
        }

        function gameOver(reason) {
            const avgAcc = photosCopied === 0 ? 0 : Math.floor(totalAccuracyEarned / photosCopied);
            document.getElementById('fail-message').innerText = reason;
            document.getElementById('final-stats-text').innerHTML = `
                Photos Traced: ${photosCopied}<br>
                Average Accuracy: ${avgAcc}%
            `;
            document.getElementById('game-over-screen').style.display = "flex";
        }

        // Coordinate logic from previous fix
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return { x: x * (canvas.width / rect.width), y: y * (canvas.height / rect.height) };
        }

        function start(e) { if (!canDraw) return; isDrawing = true; const pos = getPos(e); [lastX, lastY] = [pos.x, pos.y]; }
        function draw(e) {
            if (!isDrawing || !canDraw) return;
            const pos = getPos(e);
            ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke();
            [lastX, lastY] = [pos.x, pos.y];
            if(e.touches) e.preventDefault();
        }

        canvas.addEventListener('mousedown', start);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('touchstart', start, {passive: false});
        canvas.addEventListener('touchmove', draw, {passive: false});
        canvas.addEventListener('touchend', () => isDrawing = false);
        init();
    </script>
</body>
</html>
